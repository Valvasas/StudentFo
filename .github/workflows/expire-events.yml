# Geser event APPROVED yang tenggat utamanya sudah lewat menjadi EXPIRED.
# Event tidak dihapus: halaman detailnya tetap tayang dengan penanda
# "Pendaftaran ditutup" (lihat policy events_public_read, migration 0003).
#
# Secret yang dibutuhkan: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
name: Expire past events

on:
  # Jadwal harian kini dijalankan pg_cron di database (migration
  # 20260926120001_pg_cron_jobs.sql, ADR-030). Workflow ini tinggal jalur
  # manual/darurat — fungsinya idempoten, jadi aman dijalankan kapan saja.
  workflow_dispatch:

permissions: {}

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call expire_past_events()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --silent --show-error --fail-with-body \
            -X POST "$SUPABASE_URL/rest/v1/rpc/expire_past_events" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
