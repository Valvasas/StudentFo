# Gerbang kualitas untuk setiap push & pull request.
# Aplikasi WAJIB lolos tanpa kredensial apa pun (mode seed) — karena itu job
# ini sengaja tidak memakai secret Supabase sama sekali.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Next.js — verify & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  a11y:
    name: Aksesibilitas — axe (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Build + start dijalankan oleh webServer di playwright.config.ts.
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  database:
    name: Migration & test SQL (Postgres 15)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Versi mayor disamakan dengan Supabase. Menjalankan migration ke
    # database kosong adalah satu-satunya cara membuktikan migration
    # memang bisa di-deploy — lihat DEVIATIONS.md #1.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-migrations.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  integration:
    name: Integrasi repository Supabase (Postgres 15 + PostgREST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SupabaseEventRepository dijalankan terhadap PostgREST sungguhan dengan
    # max_rows = 1000 seperti Supabase, termasuk test paritas memory ↔ Supabase.
    # Job ini yang menemukan pencarian produksi gagal total (events_listing
    # tanpa search_vector) — lihat DECISION.md ADR-033.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/postgrest
          key: postgrest-v12.2.3
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Build produksi dalam mode Supabase: Data Cache + revalidateTag + alur admin.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:supabase
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  pipeline:
    name: Pipeline Python — tests & dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/tests/test_models.py
      - run: python pipeline/tests/test_publisher.py
      - run: python pipeline/run.py --config pipeline/config/sources.example.yaml --dry-run
